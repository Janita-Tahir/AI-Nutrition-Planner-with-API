<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - NutriPlan</title>

<link rel="stylesheet" href="styles.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>
  <nav class="navbar">
  <div class="nav-container">
    <a href="index.html" class="nav-logo">NutriPlan</a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="register.html">Register</a>
      <a href="recommendations.html">Recommendations</a>
      <a href="admin.html">Admin</a>
    </div>
  </div>
</nav>

<section class="section reveal">
  <h2>Create Your Account</h2>

  <form class="form" onsubmit="handleRegister(event)">

    <h3>Basic Info</h3>
    <input type="text" placeholder="Full Name" required>
    <input type="email" placeholder="Email" required>
    <input type="password" placeholder="Password" required>

    <h3>Personal Data</h3>
    <input type="number" placeholder="Age">
    <input type="number" placeholder="Weight (kg)">
    <input type="number" placeholder="Height (cm)">

    <select>
      <option>Activity Level</option>
      <option>Low</option>
      <option>Moderate</option>
      <option>High</option>
    </select>

    <textarea placeholder="Dietary Preferences"></textarea>
    <textarea placeholder="Allergies"></textarea>
    <textarea placeholder="Medical History"></textarea>

    <button type="submit">Register</button>
  </form>

</section>

<script src="script.js"></script>
</body>
</html>
